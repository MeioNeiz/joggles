# OpenOCD target config for the PAN1020 in the glasses.
#
#   brew install open-ocd
#   openocd -f research/tools/pan1020.cfg -c "init; dap info; shutdown"
#
# There is no vendor support for this part in OpenOCD, and none is needed to READ:
# a flash read is a plain AHB-AP memory transaction, the same one the CPU issues on a
# fetch. Only erase and program need a flash driver, which is why every read command
# below works on a completely unsupported chip.
#
# No `flash bank` is declared on purpose. Declaring one invites `flash write_image`,
# and there is no driver behind it that understands this part's FMC. Writes go through
# the FMC registers explicitly; see research/hardware-access.md, "Restoring".
#
# Wiring: RST, CLK, DAT, G on the LED-side header. **Leave VD unconnected** and let the
# glasses run from their own battery. The probe's 3.3 V rail cannot feed the LED drivers
# and a brown-out mid-erase is the one failure that may not be recoverable.

adapter driver cmsis-dap
transport select swd

# Start slow. A poor ground return on flying leads produces intermittent reads that look
# exactly like a bad solder joint. Raise it only once a dump is reproducible.
adapter speed 200

set _CHIPNAME pan1020

swd newdap $_CHIPNAME cpu -enable
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

# 16 KB of SRAM at 0x20000000, so a 8 KB work area is safe and backed up.
$_CHIPNAME.cpu configure -work-area-phys 0x20000000 \
    -work-area-size 0x2000 -work-area-backup 1

# The Raspberry Pi 3-pin debug connector carries no RESET, so OpenOCD must not try to
# drive one. Assert RST to ground by hand if the target ever starts stealing the SWD
# pins: P4.6 and P4.7 mux to UART1, I2C0 and SPI a few milliseconds after boot.
reset_config none separate
